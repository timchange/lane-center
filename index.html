<style>
/* 版面：鏡頭畫面佔滿，數值面板在下方；手機橫放時面板移到右側 */
:root{
  --bg:#0a0d10; --panel:#11161b; --edge:#26303a; --fg:#eef3f6; --mute:#8d9aa6;
  --ok:#3ddc97; --warn:#ffc400; --info:#5ec8ff;
  --fd:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --fn:'Space Grotesk','Noto Sans TC',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.45 var(--fd);overflow:hidden;-webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#000}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%}
#video{object-fit:cover;display:none}
#bg{display:none}
.top{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;gap:8px;align-items:center;justify-content:space-between;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.chip{display:inline-flex;gap:7px;align-items:center;padding:5px 11px;border-radius:999px;background:rgba(10,13,16,.74);border:1px solid var(--edge);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
.banner{position:absolute;z-index:4;left:50%;top:54px;transform:translateX(-50%);max-width:calc(100% - 32px);
  padding:9px 16px;border-radius:8px;background:var(--warn);color:#1a1400;font-weight:700;font-size:16px;text-align:center}
#flash{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;border:12px solid var(--warn);
  box-shadow:inset 0 0 70px 14px rgba(255,196,0,.6);background:rgba(255,196,0,.12)}
#flash.on{animation:blink .5s steps(1,end) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:.08}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){#flash.on{animation:none;opacity:1}}

.panel{background:var(--panel);border-top:1px solid var(--edge);display:flex;flex-direction:column;gap:10px;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));max-height:62%;overflow:auto}
@media (orientation:landscape) and (max-height:520px){
  #app{flex-direction:row}
  .panel{width:min(330px,40%);max-height:none;border-top:0;border-left:1px solid var(--edge)}
}
.big{font:700 34px/1.1 var(--fn);letter-spacing:.01em}
.sub{color:var(--mute);font-size:13px;min-height:19px}
.meter{position:relative;height:32px;border-radius:8px;background:#0b1015;border:1px solid var(--edge);overflow:hidden;--sw:33%}
.meter .safe{position:absolute;top:0;bottom:0;left:calc(50% - var(--sw));right:calc(50% - var(--sw));background:rgba(61,220,151,.15)}
.meter .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--info);opacity:.85}
.meter .tk{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--warn)}
.meter b{position:absolute;top:4px;bottom:4px;width:12px;margin-left:-6px;border-radius:4px;background:var(--fg);left:50%;transition:left .12s linear,background .12s}
.meter b.warn{background:var(--warn)}
.ends{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin-top:-4px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:500;color:var(--fg);background:#1a222a;border:1px solid var(--edge);border-radius:8px;padding:9px 15px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--info);color:#04202e;border-color:transparent;font-weight:700}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.grid{display:grid;gap:10px}
.fld{display:grid;gap:4px}
.fld label{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.fld label span{font-family:var(--fn);color:var(--info)}
.fld small{color:var(--mute);font-size:12px}
input[type=range]{width:100%;margin:0;accent-color:var(--info)}

.start{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:rgba(10,13,16,.93);
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.card{width:100%;max-width:440px;display:grid;gap:12px}
.card h1{margin:0;font:700 26px/1.2 var(--fd)}
.card p{margin:0;color:#c5d0d8}
.card .note{color:var(--mute);font-size:12px}
#err{color:var(--warn);min-height:0}
[hidden]{display:none!important}
#app.mir .stage{transform:scaleX(-1)}
#app.mir .stage .banner,#app.mir .stage .top{transform:scaleX(-1)}
#app.mir .stage .banner{left:50%;transform:translateX(-50%) scaleX(-1)}

<div id="app">
  <div class="stage" id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="bg"></canvas>
    <canvas id="ov"></canvas>
    <div id="flash"></div>
    <div class="top">
      <span class="chip"><i class="dot" id="dot"></i><span id="stat">待機</span></span>
      <span class="chip" id="modeChip">尚未開始</span>
    </div>
    <div class="banner" id="banner" hidden></div>

    <div class="start" id="start">
      <div class="card">
        <h1>車道置中</h1>
        <p>開啟後會偵測前方左右兩條車道線，標出車道中心。車身碰到任一側的線時，整個畫面會閃黃燈。</p>
        <p>手機請橫放，固定在擋風玻璃中央，鏡頭對準前方車道。</p>
        <div class="row">
          <button class="btn primary" id="bCam" type="button">開啟相機</button>
          <button class="btn" id="bDemo" type="button">示範模式</button>
        </div>
        <p id="err"></p>
        <p class="note">影像只在手機上即時處理，不會錄影或上傳。這是輔助提示，行車時請以實際路況為準。</p>
      </div>
    </div>
  </div>

  <section class="panel">
    <div>
      <div class="big" id="big">—</div>
      <div class="sub" id="sub">選擇相機或示範模式開始</div>
    </div>
    <div class="meter" id="meter">
      <i class="safe"></i><i class="mid"></i>
      <i class="tk" style="left:12.5%"></i><i class="tk" style="left:87.5%"></i>
      <b id="mk"></b>
    </div>
    <div class="ends"><span>← 左側線</span><span>右側線 →</span></div>

    <div class="fld" id="demoBox" hidden>
      <label for="demoR">模擬車子位置 <span id="demoV">自動漂移</span></label>
      <input type="range" id="demoR" min="-30" max="30" value="0">
      <div class="row"><button class="btn" id="bAuto" type="button">改為手動</button></div>
    </div>

    <div class="row">
      <button class="btn" id="bSet" type="button" aria-expanded="false">設定</button>
      <button class="btn" id="bMir" type="button" aria-pressed="false">鏡像（HUD）</button>
      <button class="btn" id="bStop" type="button">結束</button>
    </div>

    <div class="grid" id="drawer" hidden>
      <div class="fld">
        <label for="sens">偵測靈敏度 <span id="sensV"></span></label>
        <input type="range" id="sens" min="0" max="100" step="1">
        <small>抓不到線就調高，畫面亂跳就調低。</small>
      </div>
      <div class="fld">
        <label for="car">車身寬度占車道 <span id="carV"></span></label>
        <input type="range" id="car" min="50" max="95" step="1">
        <small>越寬，越早判定碰到線。一般轎車約 55–70%。</small>
      </div>
      <div class="fld">
        <label for="early">提早警示 <span id="earlyV"></span></label>
        <input type="range" id="early" min="0" max="40" step="1">
        <small>在真的碰線前，先閃燈的距離比例。</small>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
var $=function(id){return document.getElementById(id)};
var stage=$('stage'),video=$('video'),bg=$('bg'),ov=$('ov');
var bgc=bg.getContext('2d'),oc=ov.getContext('2d');
var proc=document.createElement('canvas');
var pc=proc.getContext('2d',{willReadFrequently:true});
var PW=160,PH=90,cssW=0,cssH=0,dpr=1;
var S={sens:60,car:68,early:8};
try{var j=JSON.parse(localStorage.getItem('lane-center-v1')||'null');if(j)for(var k in j)S[k]=j[k];}catch(e){}
function save(){try{localStorage.setItem('lane-center-v1',JSON.stringify(S));}catch(e){}}

var mode=null,stream=null,raf=0,lastTs=0,wake=null;
var demoAuto=true,demoE=0;
var sm={L:null,R:null},miss={L:0,R:0},lastLW=0,warnOn=false,lastGood=false;

function fit(){
  var r=stage.getBoundingClientRect();
  if(!r.width||!r.height)return;
  cssW=r.width;cssH=r.height;dpr=Math.min(window.devicePixelRatio||1,2);
  [bg,ov].forEach(function(c){c.width=Math.round(cssW*dpr);c.height=Math.round(cssH*dpr);});
  PH=Math.max(60,Math.round(PW*cssH/cssW));
  proc.width=PW;proc.height=PH;
}
if(window.ResizeObserver)new ResizeObserver(fit).observe(stage);
window.addEventListener('resize',fit);

/* 示範用的假路面：車子偏移 e（車道寬的比例，正值＝偏右） */
function scene(c,w,h,e){
  var hz=h*.38,g;
  g=c.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#0f151c');g.addColorStop(1,'#243442');
  c.fillStyle=g;c.fillRect(0,0,w,hz+1);
  g=c.createLinearGradient(0,hz,0,h);g.addColorStop(0,'#2c3238');g.addColorStop(1,'#444b53');
  c.fillStyle=g;c.fillRect(0,hz,w,h-hz);
  var lw=w*.8,cb=w/2-e*lw,vx=w/2,xl=cb-lw/2,xr=cb+lw/2,t=w*.03;
  c.fillStyle='#1c2a22';
  c.beginPath();c.moveTo(0,hz);c.lineTo(vx,hz);c.lineTo(xl-t/2,h);c.lineTo(0,h);c.fill();
  c.beginPath();c.moveTo(w,hz);c.lineTo(vx,hz);c.lineTo(xr+t/2,h);c.lineTo(w,h);c.fill();
  c.fillStyle='#e9edf0';
  c.beginPath();c.moveTo(vx,hz);c.lineTo(xl-t/2,h);c.lineTo(xl+t/2,h);c.closePath();c.fill();
  c.beginPath();c.moveTo(vx,hz);c.lineTo(xr-t/2,h);c.lineTo(xr+t/2,h);c.closePath();c.fill();
}

/* 偵測：每列在左右半邊找「比兩側亮」的細線，再用 RANSAC 擬合直線 x=a*y+b */
function fitLine(pts,side){
  if(pts.length<7)return null;
  var best=null,bc=0,n=pts.length;
  for(var it=0;it<40;it++){
    var p=pts[(Math.random()*n)|0],q=pts[(Math.random()*n)|0];
    if(Math.abs(p[1]-q[1])<6)continue;
    var a=(q[0]-p[0])/(q[1]-p[1]);
    if(side<0?a>0.05:a<-0.05)continue;
    var b=p[0]-a*p[1],cnt=0;
    for(var i=0;i<n;i++)if(Math.abs(pts[i][0]-(a*pts[i][1]+b))<2.5)cnt++;
    if(cnt>bc){bc=cnt;best=[a,b];}
  }
  if(bc<7)return null;
  var sx=0,sy=0,sxx=0,sxy=0,m=0;
  for(var i2=0;i2<n;i2++){
    if(Math.abs(pts[i2][0]-(best[0]*pts[i2][1]+best[1]))<2.5){
      var x=pts[i2][0],y=pts[i2][1];sx+=x;sy+=y;sxx+=y*y;sxy+=x*y;m++;
    }
  }
  var den=m*sxx-sy*sy;
  if(Math.abs(den)<1e-6)return {a:best[0],b:best[1]};
  var A=(m*sxy-sy*sx)/den,B=(sx-A*sy)/m;
  return {a:A,b:B};
}
function detect(g,W,H,thr){
  var y0=Math.floor(H*.5),y1=Math.floor(H*.92),cx=W>>1,L=[],R=[];
  for(var y=y0;y<=y1;y+=2){
    var row=y*W,bl=thr,xl=-1,br=thr,xr=-1;
    for(var x=14;x<W-14;x++){
      var c=(g[row+x-1]+g[row+x]+g[row+x+1])/3,a=0,b=0;
      for(var k=6;k<=12;k++){a+=g[row+x-k];b+=g[row+x+k];}
      var s=c-(a+b)/14;
      if(x<cx){if(s>bl){bl=s;xl=x;}}else{if(s>br){br=s;xr=x;}}
    }
    if(xl>=0)L.push([xl,y]);
    if(xr>=0)R.push([xr,y]);
  }
  return {L:fitLine(L,-1),R:fitLine(R,1)};
}
function upd(side,f){
  if(f){var p=sm[side];sm[side]=p?{a:p.a+(f.a-p.a)*.4,b:p.b+(f.b-p.b)*.4}:{a:f.a,b:f.b};miss[side]=0;}
  else if(++miss[side]>6)sm[side]=null;
}
function lineX(side,y){
  if(sm[side])return sm[side].a*y+sm[side].b;
  var hz=PH*.35,yb=PH*.92,wf=Math.max(0,(y-hz)/(yb-hz));
  if(side==='L'&&sm.R)return sm.R.a*y+sm.R.b-lastLW*wf;
  if(side==='R'&&sm.L)return sm.L.a*y+sm.L.b+lastLW*wf;
  return PW/2;
}

function evaluate(r){
  upd('L',r.L);upd('R',r.R);
  var yb=PH*.92,y0=PH*.5,cx=PW/2,xl=null,xr=null,inf=false;
  if(sm.L)xl=sm.L.a*yb+sm.L.b;
  if(sm.R)xr=sm.R.a*yb+sm.R.b;
  if(xl!==null&&xr!==null){
    var w=xr-xl;
    if(w>PW*.25&&w<PW*1.8)lastLW=w;else{xl=null;xr=null;}
  }else if(xl!==null&&lastLW){xr=xl+lastLW;inf=true;}
  else if(xr!==null&&lastLW){xl=xr-lastLW;inf=true;}
  else{xl=null;xr=null;}
  if(xl===null){warnOn=false;draw(null);ui(null);return;}
  var lw=xr-xl,lc=(xl+xr)/2,e=(cx-lc)/lw,limit=(1-S.car/100)/2,rr=e/limit,th=1-S.early/100;
  if(warnOn){if(Math.abs(rr)<th-.05)warnOn=false;}
  else if(Math.abs(rr)>=th)warnOn=true;
  var s={xl:xl,xr:xr,lw:lw,lc:lc,e:e,rr:rr,inf:inf,yb:yb,y0:y0};
  draw(s);ui(s);
}

function draw(s){
  oc.setTransform(1,0,0,1,0,0);oc.clearRect(0,0,ov.width,ov.height);
  if(!s)return;
  var sx=ov.width/PW,sy=ov.height/PH,u=dpr,col=warnOn?'#ffc400':'#3ddc97';
  function X(x){return x*sx}function Y(y){return y*sy}
  var y0=s.y0,yb=s.yb;
  var la=lineX('L',y0),lb=lineX('L',yb),ra=lineX('R',y0),rb=lineX('R',yb);
  oc.fillStyle=warnOn?'rgba(255,196,0,.22)':'rgba(61,220,151,.16)';
  oc.beginPath();oc.moveTo(X(la),Y(y0));oc.lineTo(X(lb),Y(yb));oc.lineTo(X(rb),Y(yb));oc.lineTo(X(ra),Y(y0));oc.closePath();oc.fill();
  oc.lineCap='round';oc.lineWidth=5*u;oc.strokeStyle=col;
  oc.setLineDash(sm.L?[]:[12*u,9*u]);
  oc.beginPath();oc.moveTo(X(la),Y(y0));oc.lineTo(X(lb),Y(yb));oc.stroke();
  oc.setLineDash(sm.R?[]:[12*u,9*u]);
  oc.beginPath();oc.moveTo(X(ra),Y(y0));oc.lineTo(X(rb),Y(yb));oc.stroke();
  oc.setLineDash([10*u,8*u]);oc.lineWidth=2*u;oc.strokeStyle='#5ec8ff';
  oc.beginPath();oc.moveTo(X((la+ra)/2),Y(y0));oc.lineTo(X((lb+rb)/2),Y(yb));oc.stroke();
  oc.setLineDash([]);
  var cx=PW/2,half=S.car/100*s.lw/2;
  oc.lineWidth=3*u;oc.strokeStyle='#ffffff';oc.lineJoin='round';
  oc.beginPath();oc.moveTo(X(cx-half),Y(yb)-16*u);oc.lineTo(X(cx-half),Y(yb));oc.lineTo(X(cx+half),Y(yb));oc.lineTo(X(cx+half),Y(yb)-16*u);oc.stroke();
  oc.beginPath();oc.moveTo(X(cx),Y(yb)-10*u);oc.lineTo(X(cx),Y(yb)+0);oc.stroke();
}

var big=$('big'),sub=$('sub'),mk=$('mk'),banner=$('banner'),flash=$('flash'),dot=$('dot'),stat=$('stat');
function setWarn(on,msg){
  banner.hidden=!on;
  if(on)banner.textContent=msg;
  flash.classList.toggle('on',on);
  mk.classList.toggle('warn',on);
  dot.className='dot '+(on?'warn':(lastGood?'ok':''));
}
function ui(s){
  if(!s){
    lastGood=false;
    big.textContent='找不到車道線';
    sub.textContent='請讓鏡頭對準前方，左右兩側都要看得到車道線';
    mk.style.opacity='.25';stat.textContent='搜尋車道線';
    setWarn(false,'');return;
  }
  lastGood=true;mk.style.opacity='1';
  var cm=Math.round(Math.abs(s.e)*350);
  big.textContent=Math.abs(s.e)<.015?'置中':((s.e>0?'偏右 ':'偏左 ')+cm+' cm');
  var p=50+Math.max(-1.2,Math.min(1.2,s.rr))/1.2*45;
  mk.style.left=p+'%';
  sub.textContent=(s.inf?'只看到單側線，依上次的車道寬度推算':'兩側車道線都已偵測')+'（以車道寬 3.5 公尺估算）';
  stat.textContent=warnOn?'警示':'追蹤中';
  if(warnOn){
    var right=s.e>0;
    setWarn(true,'車身靠近'+(right?'右':'左')+'側線，請往'+(right?'左':'右')+'修正');
  }else setWarn(false,'');
}

function step(ts){
  var t=ts/1000;
  if(mode==='cam'){
    if(video.readyState<2||!video.videoWidth)return;
    var vw=video.videoWidth,vh=video.videoHeight,k=Math.max(PW/vw,PH/vh),sw=PW/k,sh=PH/k;
    pc.drawImage(video,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,PW,PH);
  }else if(mode==='demo'){
    if(demoAuto){demoE=.2*Math.sin(t*.6);$('demoR').value=Math.round(demoE*100);}
    else demoE=$('demoR').value/100;
    scene(pc,PW,PH,demoE);
    bgc.setTransform(dpr,0,0,dpr,0,0);scene(bgc,cssW,cssH,demoE);
  }else return;
  var d=pc.getImageData(0,0,PW,PH).data,g=new Uint8Array(PW*PH);
  for(var i=0,jx=0;i<g.length;i++,jx+=4)g[i]=(d[jx]*77+d[jx+1]*150+d[jx+2]*29)>>8;
  evaluate(detect(g,PW,PH,70-S.sens*.6));
}
function tick(ts){
  raf=requestAnimationFrame(tick);
  if(ts-lastTs<66)return;
  lastTs=ts;step(ts);
}

function lock(){try{navigator.wakeLock.request('screen').then(function(w){wake=w;}).catch(function(){});}catch(e){}}
function unlock(){try{if(wake)wake.release();}catch(e){}wake=null;}
document.addEventListener('visibilitychange',function(){if(mode&&document.visibilityState==='visible')lock();});

function begin(m){
  mode=m;$('start').hidden=true;
  video.style.display=m==='cam'?'block':'none';
  bg.style.display=m==='demo'?'block':'none';
  $('demoBox').hidden=m!=='demo';
  $('modeChip').textContent=m==='demo'?'示範模式':'即時相機';
  sm.L=sm.R=null;miss.L=miss.R=0;lastLW=0;warnOn=false;lastGood=false;
  fit();lock();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
}
function stop(){
  mode=null;cancelAnimationFrame(raf);
  if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}
  video.srcObject=null;video.style.display='none';bg.style.display='none';
  oc.setTransform(1,0,0,1,0,0);oc.clearRect(0,0,ov.width,ov.height);
  setWarn(false,'');unlock();
  stat.textContent='待機';$('modeChip').textContent='尚未開始';
  big.textContent='—';sub.textContent='選擇相機或示範模式開始';mk.style.left='50%';mk.style.opacity='1';
  $('demoBox').hidden=true;$('start').hidden=false;
}
function startCam(){
  var err=$('err');err.textContent='';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    err.textContent='這個頁面不允許使用相機。請用 HTTPS 網址開啟，或先試示範模式。';return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false})
  .then(function(s){stream=s;video.srcObject=s;return video.play();})
  .then(function(){begin('cam');})
  .catch(function(e){
    if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}
    err.textContent='無法開啟相機（'+((e&&e.name)||'錯誤')+'）。請允許相機權限，並用 HTTPS 網址開啟；也可以先試示範模式。';
  });
}

$('bCam').addEventListener('click',startCam);
$('bDemo').addEventListener('click',function(){begin('demo');});
$('bStop').addEventListener('click',stop);
$('bMir').addEventListener('click',function(){var on=$('app').classList.toggle('mir');this.setAttribute('aria-pressed',String(on));});
$('bSet').addEventListener('click',function(){
  var d=$('drawer');d.hidden=!d.hidden;this.setAttribute('aria-expanded',String(!d.hidden));
});
$('bAuto').addEventListener('click',function(){
  demoAuto=!demoAuto;this.textContent=demoAuto?'改為手動':'改為自動漂移';
  $('demoV').textContent=demoAuto?'自動漂移':'手動';
});
$('demoR').addEventListener('input',function(){
  if(demoAuto){demoAuto=false;$('bAuto').textContent='改為自動漂移';$('demoV').textContent='手動';}
});

function bind(id,fmt,after){
  var el=$(id);el.value=S[id];$(id+'V').textContent=fmt(S[id]);
  el.addEventListener('input',function(){S[id]=+el.value;$(id+'V').textContent=fmt(S[id]);save();if(after)after();});
}
function zone(){$('meter').style.setProperty('--sw',(37.5*(1-S.early/100)).toFixed(1)+'%');}
bind('sens',function(v){return v+'%';});
bind('car',function(v){return v+'%';});
bind('early',function(v){return v+'%';},zone);
zone();fit();
})();
</script>

</body></html>
